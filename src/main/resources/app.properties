# Choix de l'implémentation IDao injectée dans MetierImpl (stratégie C).
# Valeurs possibles : dao | dao2 | daoFile | daoApi | daoCsv
# Peut être surchargée sans toucher à ce fichier : -Ddao.target=... ou variable d'environnement DAO_TARGET
dao.target=daoApi

# Valeur ajoutée par MetierSomme : calcul() = valeur du DAO + metier.ajout
metier.ajout=50

# Taux de TVA utilisé par MetierTva (0.20 = 20 %) : calcul() = valeur du DAO x (1 + metier.tva)
metier.tva=0.20
